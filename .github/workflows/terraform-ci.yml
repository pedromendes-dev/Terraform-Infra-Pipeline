name: Terraform CI

on:
  pull_request:
    paths:
      - 'Infra/**'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  validate-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform fmt
        working-directory: Infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: Infra
        run: terraform init -backend-config=backend-dev.hcl

      - name: Terraform validate
        working-directory: Infra
        run: terraform validate

      - name: Terraform plan (dev)
        working-directory: Infra
        run: |
          terraform plan -var-file="envs/dev/terraform.tfvars" -out=plan_dev.tfplan
          terraform show -no-color plan_dev.tfplan > plan_dev.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: |
            Infra/plan_dev.tfplan
            Infra/plan_dev.txt

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init (apply)
        working-directory: Infra
        run: terraform init -backend-config=backend-dev.hcl

      - name: Terraform apply (dev)
        working-directory: Infra
        run: terraform apply -var-file="envs/dev/terraform.tfvars" -auto-approve
