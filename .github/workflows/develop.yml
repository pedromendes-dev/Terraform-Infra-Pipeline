name: "Implantação (dev)"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::559050205686:role/github-action-pedromende-dev-pipeline"
      aws-region: "us-east-2"
      aws-statefile-s3-bucket: "pedromendes-dev-us-east-2-tarraform-statefile"
      aws-lock-dynamodb-table: "pedromendes-dev-us-east-2-terraform-lock"
